name: 🐛 Bug Report
description: Create a report to help us improve VisionForge Studio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: environment
    attributes:
      label: Operating System & Environment
      placeholder: e.g. Windows 11, Ubuntu 22.04, Python 3.11, CUDA 12.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to 'Video Lab'
        2. Upload video '...'
        3. Click 'Extract Frames'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Console or Server Logs
      render: shell
